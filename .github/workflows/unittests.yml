on:
  # A pull request is tested by the pull_request event, so a push only tests master
  push:
    branches:
      - master
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', '**.yml', 'renv.lock']
  pull_request:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', 'renv.lock']
  # Sunday night (UTC)
  schedule:
    - cron: '13 22 * * 0'
  # Start it by hand from the Actions tab, on any branch
  workflow_dispatch:
    inputs:
      jasp_version:
        description: 'JASP version: development, or the tag of a JASP release (e.g. v0.99.0.2)'
        type: string
        default: 'development'
      jaspsyntax:
        description: 'jaspSyntax of the development version: r-universe, or a jaspSyntax branch, tag or commit on GitHub (e.g. master)'
        type: string
        default: 'r-universe'

name: unit-tests

jobs:

  unit-tests:
    uses: jasp-stats/jasp-actions/.github/workflows/unittests.yml@master
    with:
      needs_JAGS: false
      # Empty unless the run was started by hand: the reusable workflow then uses development and the R-universe
      jasp_version: ${{ inputs.jasp_version }}
      jaspsyntax: ${{ inputs.jaspsyntax }}

