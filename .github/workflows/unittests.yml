on:
  # A pull request is tested by the pull_request event, so a push only tests master
  push:
    branches:
      - master
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', '**.yml', 'renv.lock']
  pull_request:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', 'renv.lock']
  # Sunday night (UTC)
  schedule:
    - cron: '13 22 * * 0'
  # Start it by hand from the Actions tab, on any branch
  workflow_dispatch:
    inputs:
      r_universe:
        description: 'JASP development, with the jaspSyntax already built on the R-universe. Uncheck to install jaspSyntax from GitHub, as given below'
        type: boolean
        default: true
      jaspsyntax:
        description: 'Only when r_universe is unchecked: a jaspSyntax branch or commit (master = JASP development), or a release tag (e.g. v0.99.0.2) to test with that JASP version'
        type: string
        default: 'master'

name: unit-tests

jobs:

  unit-tests:
    uses: jasp-stats/jasp-actions/.github/workflows/unittests.yml@master
    with:
      needs_JAGS: false
      # Empty unless the run was started by hand: the reusable workflow then uses JASP development and the R-universe
      r_universe: ${{ format('{0}', inputs.r_universe) }}
      jaspsyntax: ${{ inputs.jaspsyntax }}

