on:
  # A pull request is tested by the pull_request event, so a push only tests master
  push:
    branches:
      - master
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', '**.yml', 'renv.lock']
  pull_request:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', 'renv.lock']
  # Sunday night (UTC)
  schedule:
    - cron: '13 22 * * 0'
  # Start it by hand from the Actions tab, on any branch
  workflow_dispatch:
    inputs:
      jasp_version:
        description: 'JASP version: development, or the tag of a JASP release (e.g. v0.99.0.2)'
        type: string
        default: 'development'
      jaspsyntax_source:
        description: 'Where the jaspSyntax of the development version comes from'
        type: choice
        options:
          - r-universe
          - github
        default: 'r-universe'
      jaspsyntax_ref:
        description: 'With the github source: jaspSyntax branch, tag or commit (empty means master)'
        type: string
        default: ''

name: unit-tests

jobs:

  unit-tests:
    uses: jasp-stats/jasp-actions/.github/workflows/unittests.yml@master
    with:
      needs_JAGS: false
      # Empty unless the run was started by hand: the reusable workflow then uses development and r-universe
      jasp_version: ${{ inputs.jasp_version }}
      jaspsyntax_source: ${{ inputs.jaspsyntax_source }}
      jaspsyntax_ref: ${{ inputs.jaspsyntax_ref }}

