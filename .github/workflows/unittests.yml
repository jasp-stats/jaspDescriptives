on:
  # A pull request is tested by the pull_request event, so a push only tests master
  push:
    branches:
      - master
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', '**.yml', 'renv.lock']
  pull_request:
    paths: ['**.R', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'MAKEVARS', 'MAKEVARS.win', 'renv.lock']
  # Sunday night (UTC)
  schedule:
    - cron: '13 22 * * 0'
  # Start it by hand from the Actions tab, on any branch
  workflow_dispatch:

name: unit-tests

jobs:

  unit-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    uses: jasp-stats/jasp-actions/.github/workflows/unittests.yml@master
    with:
      needs_JAGS: false

